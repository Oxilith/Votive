# PostgreSQL credentials template
# This secret must be created BEFORE installing PostgreSQL via Helm
#
# Copy this file, update values, and encrypt with SOPS:
#   cp postgresql-secret.example.yaml postgresql-secret.yaml
#   sops -e postgresql-secret.yaml > postgresql-secret.enc.yaml
#   rm postgresql-secret.yaml
#
# Or generate random passwords:
#   openssl rand -base64 32

apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: votive-dev
type: Opaque
stringData:
  # PostgreSQL superuser password (used by Helm for admin)
  postgres-password: "CHANGE_ME_SUPERUSER_PASSWORD"

  # Application user password (used by votive services)
  password: "CHANGE_ME_APP_USER_PASSWORD"
