# Votive application secrets template
# Copy this file, update values, and encrypt with SOPS:
#   cp secrets.example.yaml secrets.yaml
#   sops -e secrets.yaml > secrets.enc.yaml
#   rm secrets.yaml  # Don't commit unencrypted secrets!
#
# To edit encrypted secrets:
#   sops secrets.enc.yaml

apiVersion: v1
kind: Secret
metadata:
  name: votive-secrets
  namespace: votive-dev
type: Opaque
stringData:
  # PostgreSQL connection string
  # Format: postgresql://user:password@host:port/database
  DATABASE_URL: "postgresql://votive:CHANGE_ME@postgresql:5432/votive"

  # JWT Authentication (min 32 characters, must be different)
  JWT_ACCESS_SECRET: "CHANGE_ME_32_CHAR_MIN_ACCESS_SECRET"
  JWT_REFRESH_SECRET: "CHANGE_ME_32_CHAR_MIN_REFRESH_SECRET"

  # Session signing (min 32 characters)
  SESSION_SECRET: "CHANGE_ME_32_CHAR_MIN_SESSION_SECRET"

  # Claude API key (required for AI analysis)
  ANTHROPIC_API_KEY: "sk-ant-api03-CHANGE_ME"

  # Admin UI API key (optional)
  ADMIN_API_KEY: "CHANGE_ME_ADMIN_API_KEY"

  # SMTP configuration (optional, leave empty to disable)
  # SMTP_HOST: "smtp.resend.com"
  # SMTP_PORT: "587"
  # SMTP_USER: "resend"
  # SMTP_PASS: "re_CHANGE_ME"
  # SMTP_FROM: "noreply@yourdomain.com"
