# Votive Test Environment Secrets
# ================================
#
# These are MOCK values for E2E testing only.
# Not real secrets - safe to commit unencrypted.
#
# Values from .env.test for deterministic testing.

apiVersion: v1
kind: Secret
metadata:
  name: votive-secrets
  namespace: votive-test
type: Opaque
stringData:
  # ============================================
  # DATABASE
  # ============================================
  DATABASE_URL: "postgresql://votive:test-password-for-e2e@postgresql:5432/votive"

  # ============================================
  # AUTHENTICATION (JWT)
  # ============================================
  JWT_ACCESS_SECRET: "test-jwt-access-secret-for-e2e-testing-abc"
  JWT_REFRESH_SECRET: "test-jwt-refresh-secret-for-e2e-testing-xyz"
  SESSION_SECRET: "test-session-secret-for-e2e-testing-purposes"

  # ============================================
  # ADMIN UI
  # ============================================
  ADMIN_API_KEY: "test-admin-api-key-for-e2e-testing-purposes"

  # ============================================
  # EXTERNAL SERVICES
  # ============================================
  # Mock API key - MOCK_CLAUDE_API=true bypasses real API calls
  ANTHROPIC_API_KEY: "mock-api-key-not-used-in-tests"

  # ============================================
  # EMAIL (SMTP) - Disabled for tests
  # ============================================
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
