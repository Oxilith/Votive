# Votive Test Environment Configuration
# ======================================
#
# Single source of truth for E2E testing.
# Contains ALL values (secrets + config) for simplicity.
# These are MOCK values - safe to commit unencrypted.
#
# Used by:
#   - Docker Compose: extracted via yq
#   - Kubernetes: applied as Secret
#   - Playwright: extracted via yq

apiVersion: v1
kind: Secret
metadata:
  name: votive-secrets
  namespace: votive-test
type: Opaque
stringData:
  # ============================================
  # SERVER
  # ============================================
  NODE_ENV: "test"
  LOG_LEVEL: "info"
  PROMPT_SERVICE_PORT: "3002"
  BACKEND_PORT: "3001"
  WORKER_HEALTH_PORT: "3003"

  # ============================================
  # DATABASE (PostgreSQL)
  # ============================================
  DATABASE_URL: "postgresql://votive:test-password-for-e2e@postgresql:5432/votive"

  # ============================================
  # AUTHENTICATION (JWT)
  # ============================================
  JWT_ACCESS_SECRET: "test-jwt-access-secret-for-e2e-testing-abc"
  JWT_REFRESH_SECRET: "test-jwt-refresh-secret-for-e2e-testing-xyz"
  JWT_ACCESS_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"
  SESSION_SECRET: "test-session-secret-for-e2e-testing-purposes"
  BCRYPT_SALT_ROUNDS: "4"

  # ============================================
  # ADMIN UI
  # ============================================
  ADMIN_API_KEY: "test-admin-api-key-for-e2e-testing-purposes"

  # ============================================
  # CORS
  # ============================================
  CORS_ORIGIN: "https://localhost"
  CORS_ORIGINS: "https://localhost"

  # ============================================
  # RATE LIMITING (high limits for tests)
  # ============================================
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
  RATE_LIMIT_LOGIN: "1000"
  RATE_LIMIT_REGISTER: "1000"
  RATE_LIMIT_PASSWORD_RESET: "1000"
  RATE_LIMIT_FORGOT_PASSWORD: "1000"
  RATE_LIMIT_TOKEN_REFRESH: "1000"
  RATE_LIMIT_USER_DATA: "1000"
  RATE_LIMIT_PROFILE: "1000"
  RATE_LIMIT_ADMIN_API: "10000"
  RATE_LIMIT_ADMIN_WINDOW_MS: "60000"
  CLAUDE_RATE_LIMIT_WINDOW_MS: "60000"
  CLAUDE_RATE_LIMIT_MAX_REQUESTS: "100"

  # ============================================
  # CLAUDE API (mocked)
  # ============================================
  MOCK_CLAUDE_API: "true"
  THINKING_ENABLED: "false"
  ANTHROPIC_API_KEY: "mock-api-key-not-used-in-tests"
  PROMPT_SERVICE_URL: "http://prompt-service:3002"

  # ============================================
  # CIRCUIT BREAKER
  # ============================================
  CIRCUIT_BREAKER_TIMEOUT: "10000"
  CIRCUIT_BREAKER_RESET_TIMEOUT: "30000"
  CIRCUIT_BREAKER_ERROR_THRESHOLD: "50"

  # ============================================
  # WORKER (disabled for tests)
  # ============================================
  JOB_TOKEN_CLEANUP_ENABLED: "false"
  JOB_TOKEN_CLEANUP_SCHEDULE: "0 * * * *"

  # ============================================
  # EMAIL (SMTP) - Disabled
  # ============================================
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""

  # ============================================
  # E2E TESTING
  # ============================================
  E2E_BASE_URL: "https://localhost"
