# PostgreSQL Credentials - Test Environment
# ==========================================
#
# MOCK values for E2E testing only.
# Not real secrets - safe to commit unencrypted.
#
# Must be applied BEFORE installing PostgreSQL via Helm.

apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: votive-test
type: Opaque
stringData:
  # ============================================
  # POSTGRESQL CREDENTIALS
  # ============================================
  # Superuser password
  postgres-password: "test-superuser-password-for-e2e"

  # Application user password (matches DATABASE_URL in secrets.yaml)
  password: "test-password-for-e2e"
