# Prod environment overlay
# Applies production-specific configurations on top of base manifests
#
# Usage:
#   kubectl apply -k k8s/overlays/prod
#   kubectl kustomize k8s/overlays/prod  # Preview without applying

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: votive-prod

# Common labels for prod environment
labels:
  - pairs:
      environment: prod
    includeSelectors: false

# Include base manifests
resources:
  - ../../base
  - namespace.yaml

# Apply patches
patches:
  - path: patches/replicas.yaml
  - path: patches/ingress.yaml

# Image tags - use specific versions in production (not latest)
images:
  - name: ghcr.io/oxilith/votive-prompt-service
    newTag: latest  # TODO: Pin to specific version for prod
  - name: ghcr.io/oxilith/votive-backend
    newTag: latest  # TODO: Pin to specific version for prod
  - name: ghcr.io/oxilith/votive-app
    newTag: latest  # TODO: Pin to specific version for prod
  - name: ghcr.io/oxilith/votive-worker
    newTag: latest  # TODO: Pin to specific version for prod

# Note: Secrets are applied separately via SOPS:
#   sops -d k8s/overlays/prod/secrets.enc.yaml | kubectl apply -f -
#   sops -d k8s/overlays/prod/postgresql-secret.enc.yaml | kubectl apply -f -
