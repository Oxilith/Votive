# kind cluster configuration for Votive local development
# Creates a single-node cluster with ingress support
#
# Usage:
#   kind create cluster --config k8s/kind/cluster-config.yaml --name votive
#
# Or use Makefile:
#   make cluster-create

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: votive
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP - for Ingress Controller
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS - for Ingress Controller with TLS
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # NodePort range for debugging (optional)
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
