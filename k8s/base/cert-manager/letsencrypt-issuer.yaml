# Let's Encrypt ClusterIssuers for production SSL certificates
#
# Two issuers provided:
#   - letsencrypt-staging: For testing (no rate limits, fake certs)
#   - letsencrypt-prod: For production (real certs, rate limited)
#
# Usage in Ingress:
#   annotations:
#     cert-manager.io/cluster-issuer: letsencrypt-prod
#
# Prerequisites:
#   - cert-manager installed
#   - Valid email address for expiry notifications

---
# Staging issuer - use for testing to avoid rate limits
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging server (fake certs, no rate limits)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # Email for certificate expiry notifications
    email: konrad.jagusiak@oxilogic.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
# Production issuer - use for real certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production server (real certs, rate limited)
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email for certificate expiry notifications
    email: konrad.jagusiak@oxilogic.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx
