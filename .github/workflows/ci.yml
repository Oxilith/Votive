name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

permissions:
  contents: read
  packages: write  # Required for GHCR push

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional --no-audit

      - name: Build shared package
        run: npm run build -w shared

      - name: Generate Prisma Client
        run: npm run db:generate -w prompt-service

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npm run type-check

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    # Integration tests use testcontainers to start PostgreSQL automatically
    # Unit tests mock Prisma so DATABASE_URL is only needed for config validation
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/votive_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional --no-audit

      - name: Build shared package
        run: npm run build -w shared

      - name: Generate Prisma Client
        run: npm run db:generate -w prompt-service

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./
          files: '**/coverage/lcov.info'
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --include=optional --no-audit

      - name: Generate Prisma Client
        run: npm run db:generate -w prompt-service

      - name: Build all workspaces
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: app/dist
          retention-days: 7

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-build
          path: backend/dist
          retention-days: 7

      - name: Upload prompt-service build artifact
        uses: actions/upload-artifact@v6
        with:
          name: prompt-service-build
          path: prompt-service/dist
          retention-days: 7

  # Build and push Docker images to GHCR (only on main branch)
  docker:
    name: Docker Build & Push
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: app
            dockerfile: app/Dockerfile
            context: .
          - name: backend
            dockerfile: backend/Dockerfile
            context: .
          - name: prompt-service
            dockerfile: prompt-service/Dockerfile
            context: .
          - name: worker
            dockerfile: worker/Dockerfile
            context: .
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/votive-${{ matrix.service.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
